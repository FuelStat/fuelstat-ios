
name: "CodeQL Security Analysis"

# Not on pull requests: the Swift analysis traces a full Xcode build and takes about 30 minutes, while the
# regular CI build (ci.yml) takes under 3. It runs after merging to main, weekly and on demand; findings show up
# in the Security tab.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          # Swift does not support build-mode "none"; CodeQL traces this build.
          build-mode: manual

      - name: Build app
        run: |
          # No index store: CodeQL does not need it, and building it makes the traced build slower.
          xcodebuild build \
            -project Fuelstat.xcodeproj \
            -scheme Fuelstat \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
