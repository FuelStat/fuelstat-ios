name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 27
        # The app targets iOS 27 (#59): xcode-27 image (macOS 27), newest stable Xcode 27 on it.
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner image"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Test FuelstatCore
        working-directory: Packages/FuelstatCore
        run: swift test

      - name: Build app
        run: |
          xcodebuild build \
            -project Fuelstat.xcodeproj \
            -scheme Fuelstat \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
